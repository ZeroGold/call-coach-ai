<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Call Coach Dashboard</title>
<link rel="icon" href="/icon.png">
<link rel="preload" href="/fonts/schibsted-grotesk-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/theme.css">
<style>
body { height: 100vh; overflow: hidden; display: flex; flex-direction: column; font-size: 14px; }

/* Title bar (the window is frameless, so this is where it's dragged) */
.titlebar {
  -webkit-app-region: drag;
  display: flex; align-items: center; gap: 8px;
  margin: 8px 8px 0; padding: 6px 6px 6px 10px; border-radius: 14px;
  font-weight: 750; font-size: 0.95rem;
}
.titlebar .logo { width: 24px; height: 24px; border-radius: 7px; display: grid; place-items: center; color: #fff; background: linear-gradient(140deg, #5b6cf0, #2c3aa8); }
.titlebar .logo svg { width: 15px; height: 15px; }
.titlebar span.title { flex: 1; }
.titlebar button { -webkit-app-region: no-drag; }

/* Layout */
.grid { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 300px; grid-template-rows: minmax(0, 1fr) auto; gap: 8px; padding: 8px; }
.transcript-panel, .sidebar { border-radius: 18px; min-height: 0; display: flex; flex-direction: column; }
.panel-head { padding: 14px 16px 8px; font-weight: 750; font-size: 0.72rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-3); }

/* Transcript as a conversation */
.transcript { flex: 1; overflow-y: auto; padding: 0 16px 16px; display: flex; flex-direction: column; gap: 8px; }
.turn { padding: 9px 13px; border-radius: 16px 16px 16px 5px; background: var(--well-2); font-size: 0.92rem; max-width: 82%; word-wrap: break-word; animation: rise-in var(--t-med) var(--ease-out); }
.turn .who { font-weight: 750; font-size: 0.68rem; letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 2px; color: var(--ink-3); }
.turn.rep { align-self: flex-end; border-radius: 16px 16px 5px 16px; background: color-mix(in oklab, var(--accent) 15%, var(--film)); }
.empty-msg { color: var(--ink-3); padding: 28px 0; text-align: center; }

/* Sidebar */
.sidebar { overflow-y: auto; }
.signal-section { padding: 0 0 12px; border-bottom: 1px solid var(--line); }
.signal-section:last-child { border-bottom: none; }
.signal-list, .history-list { list-style: none; padding: 0 16px; margin: 0; display: flex; flex-direction: column; gap: 7px; }
.signal-item { display: flex; align-items: center; gap: 9px; font-size: 0.88rem; color: var(--ink-2); }
.signal-dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--well-2); transition: background var(--t-med), box-shadow var(--t-med); }
.signal-item.on { color: var(--ink); }
.signal-item.on .signal-dot { background: var(--ok); box-shadow: 0 0 0 3px color-mix(in oklab, var(--ok) 22%, transparent); }
.signal-item.warn .signal-dot { background: var(--warn); box-shadow: 0 0 0 3px color-mix(in oklab, var(--warn) 22%, transparent); }
.signal-item.block .signal-dot { background: var(--danger); box-shadow: 0 0 0 3px color-mix(in oklab, var(--danger) 22%, transparent); }
.signal-val { margin-left: auto; font-size: 0.8rem; font-weight: 650; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.history-item { font-size: 0.86rem; color: var(--ink-2); display: flex; align-items: center; gap: 7px; animation: rise-in var(--t-med) var(--ease-out); }
.history-item .arrow { font-size: 0.7rem; }
.history-item .arrow.up { color: var(--ok); }
.history-item .arrow.down { color: var(--warn); }
.history-time { color: var(--ink-3); font-size: 0.74rem; margin-left: auto; font-variant-numeric: tabular-nums; }

/* Speech model (shared picker) */
.model-picker { display: flex; flex-direction: column; gap: 6px; padding: 0 16px; }
.model-opt { display: flex; align-items: center; gap: 8px; padding: 8px 10px; width: 100%; border-radius: 10px; border: 1px solid var(--glass-edge); background: var(--well); font: inherit; font-size: 0.84rem; color: var(--ink-2); text-align: left; transition: border-color var(--t-fast), background var(--t-fast); }
.model-opt:hover { background: var(--well-2); }
.model-opt.active { border-color: var(--accent); background: var(--film); }
.model-opt.loading { border-color: var(--warn); }
.model-name { font-weight: 750; color: var(--ink); }
.model-size { color: var(--ink-3); margin-left: auto; font-size: 0.74rem; }
.model-status { margin: 8px 16px 0; font-size: 0.76rem; color: var(--ink-3); min-height: 1em; }
.model-bar { height: 4px; border-radius: 2px; background: var(--well-2); margin-top: 4px; overflow: hidden; }
.model-bar-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-2)); }

/* Typing strip */
.input-strip { grid-column: 1 / -1; display: flex; gap: 8px; padding: 8px; border-radius: 16px; }
.input-strip select { border: 1px solid var(--glass-edge); background: var(--film); color: var(--ink); border-radius: 999px; padding: 6px 12px; font-weight: 600; }
.input-strip input { flex: 1; min-width: 0; border-radius: 999px !important; }

@media (max-width: 640px) {
  body { height: auto; overflow: auto; }
  .grid { grid-template-columns: 1fr; }
  .transcript-panel { max-height: 50vh; }
}
</style>
<script>
(function () {
  var t;
  try { t = localStorage.getItem("cc-theme"); } catch (e) {}
  if (t === "system") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  document.documentElement.setAttribute("data-theme", t === "dark" ? "dark" : "light");
})();
</script>
</head>
<body class="aurora">

<div class="titlebar glass rim">
  <span class="logo" data-icon="logo"></span>
  <span class="title">Dashboard</span>
  <button class="icon-btn" id="clearBtn" title="Clear conversation" aria-label="Clear conversation" data-icon="refresh"></button>
  <button class="icon-btn" id="minBtn" title="Minimize" aria-label="Minimize"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 12h12"/></svg></button>
  <button class="icon-btn" id="closeBtn" title="Close" aria-label="Close" data-icon="close"></button>
</div>

<div class="grid">
  <div class="transcript-panel panel rim">
    <div class="panel-head">Transcript</div>
    <div class="transcript" id="transcript">
      <div class="empty-msg" id="emptyMsg">No conversation yet. Start a capture or type below.</div>
    </div>
  </div>

  <div class="sidebar panel rim">
    <div class="signal-section">
      <div class="panel-head">Signals</div>
      <ul class="signal-list" id="signalList"></ul>
    </div>

    <div class="signal-section">
      <div class="panel-head" id="historyHead">Stage History</div>
      <ul class="history-list" id="historyList">
        <li class="history-item" style="color:var(--ink-3);font-style:italic">No changes yet</li>
      </ul>
    </div>

    <div class="signal-section">
      <div class="panel-head">Speech Model</div>
      <div class="model-picker" id="modelPicker"></div>
      <div class="model-status" id="modelStatus"></div>
    </div>
  </div>

  <form class="input-strip glass rim" id="inputForm">
    <select id="speaker" aria-label="Who said it">
      <option value="customer" id="otherOpt">Them</option>
      <option value="rep">You</option>
    </select>
    <input class="field-input" id="textIn" autocomplete="off" placeholder="Type what was said..." aria-label="Line to add">
    <button type="submit" class="btn">Add</button>
  </form>
</div>

<script type="module">
import { mountModelPicker } from "/model-picker.js";
import { hydrateIcons, onTheme } from "/ui.js";

hydrateIcons();
onTheme(() => {});
import { getCoach, buildCoach } from "/coaches.js";
const channel = new BroadcastChannel("call-coach-sync");
const transcript = document.getElementById("transcript");
const emptyMsg = document.getElementById("emptyMsg");
const signalList = document.getElementById("signalList");
const historyList = document.getElementById("historyList");

// The mode's playbook supplies the signal names and who's who. It arrives with
// the overlay's "sync" reply, or a "mode" message when the mode changes.
let mode = null;
let playbook = { copy: {}, signals: {} };

async function loadMode(id) {
  if (!/^[a-z0-9-]+$/.test(id || "") || id === mode) return;
  const custom = getCoach(id);
  playbook = custom ? buildCoach(id, custom.fields).playbook : (await import(`/modes/${id}/playbook.js`)).PLAYBOOK;
  mode = id;
  const copy = playbook.copy || {};
  document.getElementById("otherOpt").textContent = copy.other || "Them";
  document.getElementById("historyHead").textContent = `${copy.stageKicker || "Stage"} History`;
  signalList.replaceChildren(...Object.entries(playbook.signals || {}).map(([key, s]) => {
    const li = document.createElement("li");
    li.className = "signal-item";
    li.dataset.key = key;
    li.append(Object.assign(document.createElement("span"), { className: "signal-dot" }), s.label || key,
      Object.assign(document.createElement("span"), { className: "signal-val" }));
    return li;
  }));
}

function addBubble(speaker, text) {
  emptyMsg.hidden = true;
  const div = document.createElement("div");
  div.className = "turn " + speaker;
  const who = document.createElement("div");
  who.className = "who";
  who.textContent = speaker === "rep" ? (playbook.copy?.rep || "You") : (playbook.copy?.other || "Them");
  const body = document.createElement("div");
  body.textContent = text;
  div.appendChild(who);
  div.appendChild(body);
  transcript.appendChild(div);
  transcript.scrollTop = transcript.scrollHeight;
}

function renderSignals(signals) {
  for (const li of signalList.children) {
    const key = li.dataset.key;
    const val = signals[key];
    if (typeof val !== "number") continue;
    const s = playbook.signals?.[key] || {};
    li.querySelector(".signal-val").textContent = Math.round(val * 100) + "%";
    li.classList.toggle("on", val >= 0.6);
    li.classList.toggle("warn", s.warn != null && val >= s.warn);
    li.classList.toggle("block", s.block != null && val >= s.block);
  }
}

function clearAll() {
  transcript.innerHTML = "";
  emptyMsg.hidden = false;
  transcript.appendChild(emptyMsg);
  for (const li of signalList.children) {
    li.classList.remove("on", "warn", "block");
    li.querySelector(".signal-val").textContent = "";
  }
  historyList.innerHTML = '<li class="history-item" style="color:var(--ink-3);font-style:italic">No changes yet</li>';
}

function addHistory(label, from, trend) {
  const existing = historyList.querySelector("[style]");
  if (existing) existing.remove();

  const li = document.createElement("li");
  li.className = "history-item";
  const arrow = document.createElement("span");
  arrow.className = "arrow " + (trend || "");
  arrow.textContent = trend === "up" ? "▲" : trend === "down" ? "▼" : "●";
  li.appendChild(arrow);
  const txt = document.createTextNode(from ? from + " → " + label : label);
  li.appendChild(txt);
  const time = document.createElement("span");
  time.className = "history-time";
  time.textContent = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  li.appendChild(time);
  historyList.prepend(li);
}

channel.onmessage = async (e) => {
  const d = e.data;
  if (d.type === "mode" && d.id !== mode) {
    await loadMode(d.id);
    clearAll();
  }
  if (d.type === "turn") {
    addBubble(d.speaker, d.text);
  }
  if (d.type === "signals") {
    renderSignals(d.signals);
  }
  if (d.type === "stage") {
    addHistory(d.label, d.from, d.trend);
  }
  if (d.type === "sync") {
    await loadMode(d.mode);
    clearAll();
    emptyMsg.hidden = d.turns.length > 0;
    for (const t of d.turns) addBubble(t.speaker, t.text);
    if (d.signals) renderSignals(d.signals);
  }
  if (d.type === "idle") {
    clearAll();
  }
};

channel.postMessage({ type: "sync-request" });

document.getElementById("inputForm").addEventListener("submit", (e) => {
  e.preventDefault();
  const text = document.getElementById("textIn").value.trim();
  if (!text) return;
  const speaker = document.getElementById("speaker").value;
  channel.postMessage({ type: "add-turn", speaker, text }); // the overlay echoes it back as a "turn"
  document.getElementById("textIn").value = "";
});

document.getElementById("clearBtn").addEventListener("click", () => {
  channel.postMessage({ type: "clear" });
});

if (window.overlay) {
  document.getElementById("closeBtn").addEventListener("click", () => window.overlay.close());
  document.getElementById("minBtn").addEventListener("click", () => window.overlay.minimize());
} else {
  document.getElementById("closeBtn").hidden = true;
  document.getElementById("minBtn").hidden = true;
}

mountModelPicker(document.getElementById("modelPicker"), document.getElementById("modelStatus"));
</script>
</body>
</html>
